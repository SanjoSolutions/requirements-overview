<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Requirements</title>
  </head>
  <body>
    <main class="container-fluid p-4">
      <header class="mb-4"><h1 class="h4 mb-0">Requirements</h1></header>
      <div id="message" role="status" class="alert d-none"></div>
      <section aria-label="Requirement tree">
        <div class="mb-3"><label for="project" class="form-label small">Project</label><select id="project" class="form-select" aria-label="Project"></select></div>
        <div class="mb-3"><input id="search" class="form-control" type="search" placeholder="Search requirements" aria-label="Search requirements" autofocus /></div>
        <div class="d-flex gap-3 mb-3"><button id="expand" class="btn btn-link btn-sm p-0">Expand all</button><button id="collapse" class="btn btn-link btn-sm p-0">Collapse all</button></div>
        <div id="tree" class="tree border rounded p-3">Collecting descriptions…</div>
      </section>
    </main>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
