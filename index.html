<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test requirements</title>
  </head>
  <body>
    <main class="container-fluid p-4">
      <header class="d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="h4 mb-1">Test requirements</h1><div id="summary" class="text-secondary small" aria-live="polite">Collecting descriptions…</div></div>
        <button id="refresh" class="btn btn-outline-secondary btn-sm">Refresh</button>
      </header>
      <div id="message" role="status" class="alert d-none"></div>
      <div class="row g-4">
        <section class="col-lg-7" aria-label="Requirement tree">
          <div class="d-flex gap-2 mb-3"><input id="search" class="form-control" type="search" placeholder="Search requirements" aria-label="Search requirements" autofocus /><select id="framework" class="form-select" aria-label="Test framework"><option value="">All frameworks</option></select></div>
          <div class="d-flex gap-3 mb-3"><button id="expand" class="btn btn-link btn-sm p-0">Expand all</button><button id="collapse" class="btn btn-link btn-sm p-0">Collapse all</button><button id="export" class="btn btn-link btn-sm p-0">Export outline</button></div>
          <div id="tree" class="tree border rounded p-3">Collecting descriptions…</div>
        </section>
        <section class="col-lg-5" aria-label="Requirement editor">
          <div id="editor" class="border rounded p-4"><h2 class="h6">Select a requirement</h2><p class="text-secondary mb-0 small">Choose a test description in the tree.</p></div>
          <div id="jobs" class="mt-4"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
